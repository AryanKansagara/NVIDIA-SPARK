[project]
name = "meridian-backend"
version = "0.1.0"
description = "FastAPI backend for Meridian true cost of ownership agent"
requires-python = ">=3.11"
dependencies = [
  "chromadb>=0.5.0,<1.0.0",
  "ddgs>=9.0.0",
  "duckdb>=1.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "httpx>=0.27.0,<1.0.0",
  "numpy>=1.26.0",
  "pandas>=3.0.3",
  "pyarrow>=16.0.0",
  "pydantic>=2.7.0,<3.0.0",
  "pydantic-settings>=2.2.1,<3.0.0",
  "pypdf>=4.0.0,<5.0.0",
  "pyproj>=3.6.0",
  "pyshp>=2.3.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0,<9.0.0",
  "pytest-asyncio>=0.23.0",
  "reportlab>=4.0.0",
]
# On-device speech-to-text (heavy; optional). Install with: uv pip install -e ".[speech]"
# Also requires a system ffmpeg on PATH to decode browser audio.
speech = [
  "nemo_toolkit[asr]",
  "torch",
  "torchaudio",
  "soundfile>=0.12.0",
  "imageio-ffmpeg>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
