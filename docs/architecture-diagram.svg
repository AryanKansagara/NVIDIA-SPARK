<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1500" viewBox="0 0 1300 1500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- ===================== DEFS ===================== -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arrowFb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arrowNv" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#15803d"/>
    </marker>
  </defs>

  <!-- ===================== BACKGROUND ===================== -->
  <rect x="0" y="0" width="1300" height="1500" fill="#f8fafc"/>

  <!-- ===================== TITLE ===================== -->
  <text x="650" y="46" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">Meridian — System Architecture</text>
  <text x="650" y="72" text-anchor="middle" font-size="14" fill="#475569">Toronto property true 10-year cost-of-ownership · running locally on an NVIDIA DGX Spark (GB10)</text>

  <!-- ===================== LEGEND ===================== -->
  <g font-size="12" fill="#334155">
    <rect x="930" y="90" width="350" height="78" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="945" y="110" font-weight="700" fill="#0f172a">Legend</text>
    <line x1="945" y1="126" x2="985" y2="126" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="992" y="130">Primary request / data flow</text>
    <line x1="945" y1="146" x2="985" y2="146" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowFb)"/>
    <text x="992" y="150">Graceful-degradation fallback</text>
    <rect x="1130" y="118" width="16" height="16" rx="3" fill="#dcfce7" stroke="#15803d"/>
    <text x="1152" y="130">NVIDIA / GPU</text>
    <rect x="1130" y="140" width="16" height="16" rx="3" fill="#fef3c7" stroke="#d97706"/>
    <text x="1152" y="152">Fallback path</text>
  </g>

  <!-- ============================================================ -->
  <!-- LAYER 1: CLIENT -->
  <!-- ============================================================ -->
  <rect x="40" y="100" width="850" height="200" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="60" y="126" font-size="15" font-weight="700" fill="#1d4ed8">1 · CLIENT LAYER</text>

  <!-- Browser -->
  <rect x="70" y="150" width="150" height="70" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="145" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Browser</text>
  <text x="145" y="200" text-anchor="middle" font-size="12" fill="#475569">user</text>

  <!-- Next.js frontend -->
  <rect x="290" y="140" width="280" height="120" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="430" y="165" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Next.js 15 Frontend (TypeScript)</text>
  <text x="430" y="186" text-anchor="middle" font-size="12" fill="#475569">Leaflet map · Recharts</text>
  <text x="430" y="206" text-anchor="middle" font-size="11" fill="#64748b">lib/api.ts → fetchReport()</text>
  <text x="430" y="224" text-anchor="middle" font-size="11" fill="#64748b">components/property-map.tsx</text>

  <!-- Offline fallback -->
  <rect x="630" y="150" width="230" height="100" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="745" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">OFFLINE FALLBACK</text>
  <text x="745" y="194" text-anchor="middle" font-size="11" fill="#92400e">lib/report.ts</text>
  <text x="745" y="210" text-anchor="middle" font-size="11" fill="#92400e">buildPreviewReport()</text>
  <text x="745" y="232" text-anchor="middle" font-size="10.5" fill="#a16207">TS mirror of backend engine</text>

  <line x1="220" y1="185" x2="288" y2="185" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="200" x2="628" y2="200" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowFb)"/>
  <text x="598" y="194" text-anchor="middle" font-size="10" fill="#b45309">backend down</text>

  <!-- ============================================================ -->
  <!-- LAYER 2: PROXY -->
  <!-- ============================================================ -->
  <rect x="290" y="330" width="280" height="74" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="430" y="356" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">2 · PROXY — Next.js rewrites</text>
  <text x="430" y="376" text-anchor="middle" font-size="11.5" fill="#475569">/api/* → http://localhost:8000 (no CORS)</text>
  <text x="430" y="394" text-anchor="middle" font-size="11" fill="#64748b">frontend/next.config.ts</text>

  <line x1="430" y1="260" x2="430" y2="328" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="438" y="298" font-size="11" fill="#334155">HTTP fetch</text>

  <!-- ============================================================ -->
  <!-- LAYER 3 + 4: BACKEND -->
  <!-- ============================================================ -->
  <rect x="40" y="430" width="1000" height="560" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="60" y="456" font-size="15" font-weight="700" fill="#15803d">3 · BACKEND — FastAPI (Python 3.11, fully async)</text>

  <!-- entry -->
  <rect x="300" y="470" width="440" height="64" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="520" y="494" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">POST /api/v1/report</text>
  <text x="520" y="514" text-anchor="middle" font-size="11.5" fill="#475569">orchestrator: report_service.py → build_report()</text>
  <text x="520" y="528" text-anchor="middle" font-size="10.5" fill="#64748b">debug: GET /api/v1/debug/{geocode,heritage,flood,development}</text>

  <line x1="430" y1="404" x2="430" y2="468" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Pipeline container -->
  <rect x="60" y="556" width="960" height="414" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="80" y="580" font-size="14" font-weight="700" fill="#0f172a">4 · 4-AGENT PIPELINE (sequential)</text>

  <!-- Agent 1: Geocode -->
  <rect x="80" y="596" width="200" height="78" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="180" y="620" text-anchor="middle" font-size="13" font-weight="700" fill="#0e7490">Agent 1 · Geocode</text>
  <text x="180" y="640" text-anchor="middle" font-size="11" fill="#475569">services/geocoding</text>
  <text x="180" y="657" text-anchor="middle" font-size="11" fill="#475569">Nominatim / OpenStreetMap</text>

  <!-- Agent 2: Data retrieval (async) -->
  <rect x="80" y="700" width="500" height="180" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="90" y="722" font-size="13" font-weight="700" fill="#0e7490">Agent 2 · Data retrieval (async, parallel)</text>
  <text x="90" y="740" font-size="10.5" fill="#b45309">each source falls back to a heuristic → surfaced as warnings</text>

  <rect x="95" y="752" width="150" height="110" rx="8" fill="#ffffff" stroke="#06b6d4"/>
  <text x="170" y="774" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Heritage</text>
  <text x="170" y="792" text-anchor="middle" font-size="10" fill="#475569">heritage.py</text>
  <text x="170" y="808" text-anchor="middle" font-size="10" fill="#475569">Toronto CKAN</text>
  <text x="170" y="822" text-anchor="middle" font-size="10" fill="#475569">~12k records</text>
  <rect x="103" y="832" width="134" height="22" rx="6" fill="#fef3c7" stroke="#d97706" stroke-dasharray="4 3"/>
  <text x="170" y="847" text-anchor="middle" font-size="9.5" fill="#b45309">heuristic fallback</text>

  <rect x="262" y="752" width="150" height="110" rx="8" fill="#ffffff" stroke="#06b6d4"/>
  <text x="337" y="774" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Flood</text>
  <text x="337" y="792" text-anchor="middle" font-size="10" fill="#475569">flood.py</text>
  <text x="337" y="808" text-anchor="middle" font-size="10" fill="#475569">TRCA</text>
  <text x="337" y="822" text-anchor="middle" font-size="10" fill="#475569">ArcGIS REST</text>
  <rect x="270" y="832" width="134" height="22" rx="6" fill="#fef3c7" stroke="#d97706" stroke-dasharray="4 3"/>
  <text x="337" y="847" text-anchor="middle" font-size="9.5" fill="#b45309">heuristic fallback</text>

  <rect x="429" y="752" width="150" height="110" rx="8" fill="#ffffff" stroke="#06b6d4"/>
  <text x="504" y="774" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Development</text>
  <text x="504" y="792" text-anchor="middle" font-size="10" fill="#475569">development.py</text>
  <text x="504" y="808" text-anchor="middle" font-size="10" fill="#475569">CKAN</text>
  <text x="504" y="822" text-anchor="middle" font-size="10" fill="#475569">~26k records</text>
  <rect x="437" y="832" width="134" height="22" rx="6" fill="#fef3c7" stroke="#d97706" stroke-dasharray="4 3"/>
  <text x="504" y="847" text-anchor="middle" font-size="9.5" fill="#b45309">heuristic fallback</text>

  <!-- Agent 3: cost engine -->
  <rect x="80" y="906" width="500" height="50" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="90" y="926" font-size="13" font-weight="700" fill="#0e7490">Agent 3 · Deterministic cost engine — engine/report_engine.py</text>
  <text x="90" y="944" font-size="10.5" fill="#475569">owns ALL numbers: land transfer tax · property tax · CMHC premium · 2-term mortgage · risk loadings · transit dividend</text>

  <!-- Agent 4: synthesis -->
  <rect x="610" y="596" width="200" height="78" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="710" y="620" text-anchor="middle" font-size="13" font-weight="700" fill="#0e7490">Agent 4 · LLM Synthesis</text>
  <text x="710" y="640" text-anchor="middle" font-size="11" fill="#475569">synthesis/service.py</text>
  <text x="710" y="657" text-anchor="middle" font-size="11" fill="#475569">narrates engine output</text>

  <!-- Side modules -->
  <rect x="610" y="700" width="390" height="256" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="620" y="722" font-size="12.5" font-weight="700" fill="#334155">Supporting modules</text>

  <rect x="625" y="734" width="360" height="64" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="630" y="754" font-size="12" font-weight="700" fill="#166534">GPU Monte Carlo — gpu/monte_carlo.py</text>
  <text x="630" y="772" font-size="10.5" fill="#475569">10k sims · P10 / P50 / P90</text>
  <rect x="820" y="778" width="155" height="14" rx="5" fill="#fef3c7" stroke="#d97706" stroke-dasharray="4 3"/>
  <text x="897" y="789" text-anchor="middle" font-size="9" fill="#b45309">CuPy → NumPy fallback</text>

  <rect x="625" y="808" width="360" height="64" rx="8" fill="#ffffff" stroke="#0891b2" stroke-width="1.2"/>
  <text x="630" y="828" font-size="12" font-weight="700" fill="#0f172a">RAG land-law context — rag/service.py</text>
  <text x="630" y="846" font-size="10.5" fill="#475569">retrieval-augmented narration</text>
  <rect x="790" y="852" width="185" height="14" rx="5" fill="#fef3c7" stroke="#d97706" stroke-dasharray="4 3"/>
  <text x="882" y="863" text-anchor="middle" font-size="9" fill="#b45309">NemoRetriever → ChromaDB fallback</text>

  <rect x="625" y="882" width="360" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="630" y="902" font-size="12" font-weight="700" fill="#0f172a">Map / community-pricing geometry</text>
  <text x="630" y="922" font-size="10.5" fill="#475569">geo features feeding the Leaflet map &amp; pricing context</text>

  <!-- pipeline internal arrows -->
  <line x1="180" y1="674" x2="180" y2="698" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="330" y1="880" x2="330" y2="904" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="930" x2="710" y2="930" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M710 906 L710 676" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="722" y="800" font-size="10" fill="#334155">engine + MC + RAG</text>
  <text x="722" y="814" font-size="10" fill="#334155">→ Agent 4</text>
  <line x1="580" y1="635" x2="608" y2="635" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="0"/>
  <line x1="710" y1="674" x2="710" y2="698" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- ============================================================ -->
  <!-- LAYER 5: NVIDIA / LLM -->
  <!-- ============================================================ -->
  <rect x="40" y="1020" width="700" height="190" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="60" y="1046" font-size="15" font-weight="700" fill="#15803d">5 · NVIDIA / LLM LAYER — local-first, API fallback</text>

  <!-- local NIM -->
  <rect x="70" y="1060" width="300" height="96" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="220" y="1084" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">DEFAULT · Local NIM container</text>
  <text x="220" y="1104" text-anchor="middle" font-size="11.5" fill="#475569">localhost:8080/v1</text>
  <text x="220" y="1122" text-anchor="middle" font-size="11" fill="#475569">nvidia/nemotron-nano-12b-v2-vl</text>
  <text x="220" y="1142" text-anchor="middle" font-size="10.5" fill="#166534">on DGX Spark GB10 GPU</text>

  <!-- hosted API -->
  <rect x="410" y="1060" width="300" height="96" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="560" y="1084" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">FALLBACK · Hosted NVIDIA API</text>
  <text x="560" y="1104" text-anchor="middle" font-size="11.5" fill="#92400e">integrate.api.nvidia.com/v1</text>
  <text x="560" y="1124" text-anchor="middle" font-size="11" fill="#92400e">auth via NIM_API_KEY</text>
  <text x="560" y="1144" text-anchor="middle" font-size="10.5" fill="#a16207">used when local NIM unavailable</text>

  <line x1="370" y1="1108" x2="408" y2="1108" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowFb)"/>

  <!-- GPU box -->
  <rect x="760" y="1020" width="280" height="190" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="900" y="1046" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">NVIDIA GB10 GPU</text>
  <text x="900" y="1066" text-anchor="middle" font-size="11.5" fill="#475569">(DGX Spark)</text>
  <rect x="785" y="1086" width="230" height="50" rx="8" fill="#ffffff" stroke="#15803d"/>
  <text x="900" y="1108" text-anchor="middle" font-size="11.5" fill="#0f172a">powers Monte Carlo (CuPy)</text>
  <text x="900" y="1124" text-anchor="middle" font-size="10.5" fill="#475569">10k sims · P10/P50/P90</text>
  <rect x="785" y="1146" width="230" height="46" rx="8" fill="#ffffff" stroke="#15803d"/>
  <text x="900" y="1168" text-anchor="middle" font-size="11.5" fill="#0f172a">hosts local NIM inference</text>
  <text x="900" y="1183" text-anchor="middle" font-size="10.5" fill="#475569">nemotron-nano-12b-v2-vl</text>

  <!-- Agent 4 -> NVIDIA layer -->
  <path d="M710 660 C 900 660, 1130 760, 1130 1000 C 1130 1050, 1050 1090, 1018 1108" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#arrowNv)"/>
  <text x="1145" y="900" font-size="10.5" fill="#15803d">Agent 4 LLM calls</text>
  <line x1="220" y1="1060" x2="220" y2="676" stroke="#15803d" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="226" y="900" font-size="10" fill="#15803d" transform="rotate(0 226 900)">try local first</text>

  <!-- Monte Carlo -> GPU -->
  <line x1="985" y1="766" x2="900" y2="1018" stroke="#15803d" stroke-width="2" marker-end="url(#arrowNv)"/>
  <text x="950" y="900" font-size="10" fill="#15803d">MC sims</text>

  <!-- ============================================================ -->
  <!-- LAYER 6: EXTERNAL DATA SOURCES -->
  <!-- ============================================================ -->
  <rect x="40" y="1250" width="1000" height="200" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="60" y="1276" font-size="15" font-weight="700" fill="#c2410c">6 · EXTERNAL DATA SOURCES</text>

  <rect x="80" y="1296" width="280" height="120" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
  <text x="220" y="1330" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Toronto Open Data</text>
  <text x="220" y="1352" text-anchor="middle" font-size="12" fill="#475569">CKAN API</text>
  <text x="220" y="1374" text-anchor="middle" font-size="11" fill="#64748b">Heritage ~12k · Development ~26k</text>

  <rect x="400" y="1296" width="280" height="120" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
  <text x="540" y="1330" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">TRCA</text>
  <text x="540" y="1352" text-anchor="middle" font-size="12" fill="#475569">ArcGIS REST</text>
  <text x="540" y="1374" text-anchor="middle" font-size="11" fill="#64748b">flood / hazard geometry</text>

  <rect x="720" y="1296" width="280" height="120" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
  <text x="860" y="1330" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Nominatim</text>
  <text x="860" y="1352" text-anchor="middle" font-size="12" fill="#475569">OpenStreetMap</text>
  <text x="860" y="1374" text-anchor="middle" font-size="11" fill="#64748b">geocoding</text>

  <!-- data source arrows -->
  <line x1="170" y1="862" x2="220" y2="1294" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="1294" x2="380" y2="862" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="860" y1="1294" x2="220" y2="676" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="0" opacity="0.55"/>
  <text x="560" y="1075" font-size="10.5" fill="#334155" opacity="0.8">CKAN · ArcGIS · Nominatim ↔ Agents 1 &amp; 2</text>

  <!-- footer -->
  <text x="650" y="1478" text-anchor="middle" font-size="11" fill="#94a3b8">Graceful degradation throughout: every external dependency and the GPU/LLM path has a deterministic fallback.</text>
</svg>
